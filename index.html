<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1f2a24;--mut:#6b756e;--pri:#1f7a5a;--priD:#155a42;--ok:#2e9e5b;--bad:#c0392b;--lock:#cfcfc6;--bd:#e3ded0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--tx:#eaf0ec;--mut:#9aa8a0;--pri:#3fbf8f;--priD:#2e9e74;--lock:#3a443e;--bd:#2c3a33}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.ar{font-family:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;direction:rtl}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.lv{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--tx);font:inherit}
.lv.locked{opacity:.55;cursor:not-allowed;background:var(--lock)}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.locked .num{background:var(--mut)}
.lv b{display:block}.lv small{color:var(--mut)}
.st{margin-left:auto;font-size:1.1rem;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn:hover{background:var(--priD)}.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.5;cursor:default}
.back{background:none;border:0;color:var(--pri);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:6px}
.voc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.voc div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.voc .ar{font-size:1.7rem;display:block;line-height:1.5}.voc small{color:var(--mut)}
.ex{padding:8px 0;border-bottom:1px dashed var(--bd)}.ex:last-child{border:0}
.ex .ar{font-size:1.6rem;display:block;text-align:right}
.note{background:rgba(31,122,90,.1);border-left:4px solid var(--pri);padding:10px 12px;border-radius:8px;margin:10px 0}
.q{font-size:1.05rem;font-weight:600;margin-bottom:10px}
.q .ar{font-size:1.5rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt.ar{text-align:right;font-size:1.4rem}
.opt.ok{border-color:var(--ok);background:rgba(46,158,91,.15)}.opt.no{border-color:var(--bad);background:rgba(192,57,43,.13)}
.res{text-align:center}.res .big{font-size:3rem}
.stars{font-size:1.8rem;letter-spacing:4px}
.vc{position:relative;cursor:pointer}.sp{position:absolute;top:3px;left:6px;font-style:normal;font-size:.75rem;opacity:.65}.ex{cursor:pointer}.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:.9rem;text-align:center;z-index:50;opacity:.95}
.body{margin-top:8px;font-size:.95rem}.body p{margin:6px 0}.tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:.85rem}.tb th,.tb td{border:1px solid var(--bd);padding:6px;text-align:center}.tb th{background:rgba(31,122,90,.12)}.tb .ar{font-size:1.35rem;line-height:1.6}.bad{color:var(--bad)}.good{color:var(--ok)}
.utoast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:#14352a;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:8px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:.9rem}.utoast span{flex:1}.utoast button{background:#3fbf8f;color:#06231a;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}.utoast .x{background:transparent;color:#cfe;font-weight:500}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin-top:20px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;font-size:.8rem}
</style>
</head>

const L=[
{t:"Isim Isyarah: هَذَا",d:"Kata tunjuk “ini” (laki-laki)",

q:[["Arti هَذَا كِتَابٌ ?",["Ini buku","Itu buku","Ini pena","Itu pintu"],0],["Arti مُدَرِّسٌ ?",["Siswa","Guru","Masjid","Pintu"],1],["“Ini pintu” dalam bahasa Arab:",["هَذَا قَلَمٌ","هَذَا بَابٌ","هَذَا طَالِبٌ","هَذَا مَسْجِدٌ"],1],["Arti قَلَمٌ ?",["Buku","Pintu","Pena","Guru"],2],["هَذَا dipakai untuk benda berjenis...",["Mudzakkar","Muannats","Jamak saja","Pertanyaan"],0]]},

{t:"مَا dan مَنْ",d:"Apa ini? Siapa ini?",

{t:"Jamak Salim",d:"Jamak mudzakkar (ـُونَ) & muannats (ـَاتٌ)",

q:[["Jamak salim dari مُسْلِمٌ :",["مُسْلِمَانِ","مُسْلِمُونَ","مُسْلِمَاتٌ","الْمُسْلِمُ"],1],["Jamak muannats salim dari طَالِبَةٌ :",["طَالِبَاتٌ","طَالِبُونَ","طَالِبَانِ","طَالِبَتَانِ"],0],["Arti هُمْ ؟",["Dia (lk)","Mereka (lk)","Mereka (pr)","Kami"],1],["Arti مُهَنْدِسُونَ ؟",["Dua insinyur","Insinyur itu","Para insinyur","Para guru"],2],["Akhiran jamak mudzakkar salim (rafa’):",["ـَانِ","ـُونَ","ـَاتٌ","ـَةٌ"],1]]},

};
Object.keys(DEEP).forEach(i=>Object.assign(L[i],DEEP[i]));
let S={done:{}}; // done[i]=bestScore%
try{const r=localStorage.getItem("dl_prog");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("dl_prog",JSON.stringify(S))}catch(e){}};
if(!S.m){const o=S.done||{},d={};for(const k in o)d[+k>=10?+k+3:+k]=o[k];S.done=d;S.m=1;save()}
const $=document.getElementById("app");
const EX=[{t:"Ujian Akhir Jilid 1",a:0,b:6},{t:"Ujian Akhir Jilid 2",a:7,b:12},{t:"Ujian Akhir Jilid 3",a:13,b:29}];
const exOpen=j=>{for(let i=EX[j].a;i<=EX[j].b;i++)if(!(S.done[i]>=PASS))return false;return true};

function toast(m){const o=document.querySelector(".toast");if(o)o.remove();const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function say(t){
  if(!("speechSynthesis" in window)){toast("Perangkat ini belum mendukung suara.");return}
  const u=new SpeechSynthesisUtterance(t.replace(/\u0640/g,""));u.lang="ar-SA";u.rate=0.75;
  const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^ar/i.test(x.lang));
  if(v)u.voice=v;else if(vs.length)toast("Suara Arab belum terpasang. Aktifkan di Pengaturan > Teks-ke-suara.");
  try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("Suara tidak bisa diputar.")}
}
// --- Sertifikat ---
const allEx=()=>!!S.ex&&EX.every((x,j)=>S.ex[j]>=PASS);
function drawCert(){
  const c=document.getElementById("cv");if(!c)return;const g=c.getContext("2d"),W=1200,H=850;
  g.fillStyle="#fbf8ee";g.fillRect(0,0,W,H);
  g.strokeStyle="#1f7a5a";g.lineWidth=14;g.strokeRect(30,30,W-60,H-60);g.strokeStyle="#c9a13b";g.lineWidth=4;g.strokeRect(54,54,W-108,H-108);
  g.textAlign="center";g.fillStyle="#1f7a5a";
  g.font="56px Amiri, 'Traditional Arabic', serif";g.fillText("بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ",W/2,140);
  g.font="bold 50px system-ui, sans-serif";g.fillText("SERTIFIKAT PENYELESAIAN",W/2,235);
  g.fillStyle="#555";g.font="28px system-ui, sans-serif";g.fillText("Diberikan kepada",W/2,310);
  g.fillStyle="#155a42";g.font="bold 72px Amiri, Georgia, serif";g.fillText((S.name||"").trim()||"(isi nama)",W/2,415);
  g.strokeStyle="#c9a13b";g.lineWidth=3;g.beginPath();g.moveTo(300,440);g.lineTo(900,440);g.stroke();
  g.fillStyle="#333";g.font="28px system-ui, sans-serif";g.fillText("yang telah menyelesaikan seluruh level dan ujian akhir",W/2,500);
  g.fillStyle="#1f7a5a";g.font="bold 40px system-ui, sans-serif";g.fillText("Belajar Durusul Lughah · Jilid 1–3",W/2,565);
  const avg=Math.round(EX.reduce((a,_,j)=>a+(S.ex?S.ex[j]||0:0),0)/EX.length);
  g.fillStyle="#333";g.font="28px system-ui, sans-serif";g.fillText("Nilai rata-rata ujian akhir: "+avg+"%",W/2,630);
  g.fillText(new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),W/2,720);
  g.fillStyle="#888";g.font="22px system-ui, sans-serif";g.fillText("lughoh.pages.dev",W/2,790)
}
function cert(){
  $.innerHTML=`<button class="back" onclick="home()">← Daftar level</button><h1>🎓 Sertifikat</h1><p class="sub">Isi namamu, lalu simpan sebagai gambar.</p>
  <div class="card"><input id="nm" type="text" maxlength="40" value="${(S.name||"").replace(/"/g,"&quot;")}" placeholder="Nama lengkap" oninput="S.name=this.value;save();drawCert()" style="width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)"></div>
  <canvas id="cv" width="1200" height="850" style="width:100%;height:auto;border-radius:12px;border:1px solid var(--bd)"></canvas>
  <button class="btn" onclick="dlCert()">Simpan gambar</button>`;drawCert();window.scrollTo(0,0)
}
function dlCert(){const c=document.getElementById("cv");const a=document.createElement("a");a.download="sertifikat-durusul-lughah.png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove()}
function lockEx(){alert("Ujian akhir terkunci 🔒\nLulus semua level di jilid ini dulu.")}
function exam(j){const x=EX[j];let p=[];for(let i=x.a;i<=x.b;i++)p=p.concat(L[i].q);const qs=sh(p).slice(0,10).map(q=>({q:q[0],o:sh(q[1]),c:q[1][q[2]]}));Q={ex:j,i:x.a,k:0,s:0,qs,lock:false};ask()}
function finishEx(){const p=Math.round(Q.s/Q.qs.length*100),j=Q.ex,ok=p>=PASS;S.ex=S.ex||{};if(S.ex[j]==null||p>S.ex[j]){S.ex[j]=p;save()}
$.innerHTML=`<div class="card res"><div class="big">${ok?"🏆":"💪"}</div><h1>${ok?"Lulus!":"Belum lulus"}</h1><p>${EX[j].t}</p><p>Nilai: <b>${p}%</b> (${Q.s}/${Q.qs.length} benar)</p><p class="sub">${ok?(allEx()?"Alhamdulillah, ketiga jilid tamat! 🎉":"Mumtaz! Jilid ini tuntas."):"Butuh minimal "+PASS+"%. Ulangi materi lalu coba lagi."}</p></div><button class="btn" onclick="exam(${j})">${ok?"Ulangi ujian":"Coba lagi"}</button>${ok&&allEx()?'<button class="btn" onclick="cert()">🎓 Lihat sertifikat</button>':""}<button class="btn alt" onclick="home()">Daftar level</button>`;window.scrollTo(0,0)}
const unlocked=i=>i===0||S.done[i-1]>=PASS;
const stars=p=>p>=100?3:p>=90?2:p>=PASS?1:0;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){
  const n=L.filter((_,i)=>S.done[i]>=PASS).length;
  let h=`<h1>📖 Belajar Durusul Lughah</h1><p class="sub">Selesaikan tiap ujian dengan nilai ≥ ${PASS}% untuk membuka level berikutnya.</p>
  <div class="bar"><i style="width:${n/L.length*100}%"></i></div><p class="sub" style="margin-top:-10px">${n} dari ${L.length} level selesai</p>`;
  L.forEach((l,i)=>{
    if(JS[i])h+=`<h2 style="font-size:1.05rem;margin:18px 0 8px">${JS[i]}</h2>`;const u=unlocked(i),p=S.done[i],s=p>=PASS?"⭐".repeat(stars(p)):"";
    h+=`<button class="lv ${u?"":"locked"}" onclick="${u?`mat(${i})`:`lockMsg()`}"><span class="num">${u?i+1:"🔒"}</span><span><b>${l.t}</b><small>${l.d}</small></span><span class="st">${u?(s||(p!=null?p+"%":"▶")):""}</span></button>`;
  });
  h+=`<h2 style="font-size:1.05rem;margin:18px 0 8px">🏆 Ujian Akhir per Jilid</h2>`;
  EX.forEach((x,j)=>{const u=exOpen(j),p=S.ex&&S.ex[j];h+=`<button class="lv ${u?"":"locked"}" onclick="${u?`exam(${j})`:`lockEx()`}"><span class="num">${u?"🏆":"🔒"}</span><span><b>${x.t}</b><small>${u?"10 soal acak dari seluruh level":"Lulus level "+(x.a+1)+"–"+(x.b+1)+" dulu"}</small></span><span class="st">${p>=PASS?"✅ "+p+"%":(p!=null?p+"%":"")}</span></button>`});
  if(allEx())h+=`<button class="lv" onclick="cert()"><span class="num">🎓</span><span><b>Sertifikat Penyelesaian</b><small>Selamat! Ketiga jilid sudah tamat</small></span><span class="st">🏅</span></button>`;
  h+=`<div class="foot">Ringkasan alur Jilid 1–3 (belum seluruh bab). Cocokkan dengan kitab untuk pendalaman.<br><button class="link" onclick="reset()">Reset progres</button></div>`;
  $.innerHTML=h;window.scrollTo(0,0);
}
function lockMsg(){alert("Level terkunci 🔒\nLulus ujian level sebelumnya dulu (≥ "+PASS+"%).")}
function reset(){if(confirm("Hapus semua progres?")){S={done:{}};save();home()}}

function mat(i){
  const l=L[i];
  let h=`<button class="back" onclick="home()">← Daftar level</button><h1>Level ${i+1}: ${l.t}</h1><p class="sub">${l.d}</p>
  <div class="card"><b>Kosakata</b><div class="voc" style="margin-top:8px">${l.v.map(v=>`<div class="vc" data-t="${v[0]}" onclick="say(this.dataset.t)"><i class="sp">🔊</i><span class="ar">${v[0]}</span><small>${v[1]}</small></div>`).join("")}</div></div>
  <div class="card"><b>Penjelasan</b><div class="note">${l.n}</div></div>${(l.x||[]).map(x=>`<div class="card"><b>${x[0]}</b><div class="body">${x[1]}</div></div>`).join("")}
  <div class="card"><b>Contoh kalimat</b>${l.e.map(e=>`<div class="ex" data-t="${e[0]}" onclick="say(this.dataset.t)"><span class="ar">${e[0]}</span><small>🔊 ${e[1]}</small></div>`).join("")}</div>
  <button class="btn" onclick="quiz(${i})">Mulai Ujian ✍️</button>`;
  $.innerHTML=h;window.scrollTo(0,0);
}

let Q;
function quiz(i){Q={i,k:0,s:0,qs:sh(L[i].q).map(q=>{const c=q[1][q[2]];return{q:q[0],o:sh(q[1]),c}}),lock:false};ask()}
function isAr(t){return /[\u0600-\u06FF]/.test(t)}
function ask(){
  const q=Q.qs[Q.k];
  let qt=q.q.replace(/([\u0600-\u06FF][\u0600-\u06FF\s\u061F:_]*[\u0600-\u06FF؟])/g,'<span class="ar">$1</span>');
  $.innerHTML=`<button class="back" onclick="${Q.ex!=null?'home()':'mat('+Q.i+')'}">${Q.ex!=null?'← Daftar level':'← Kembali ke materi'}</button><p class="sub">${Q.ex!=null?EX[Q.ex].t:'Ujian Level '+(Q.i+1)} · Soal ${Q.k+1}/${Q.qs.length}</p>
  <div class="bar"><i style="width:${Q.k/Q.qs.length*100}%"></i></div>
  <div class="card"><div class="q">${qt}</div><div id="os">${q.o.map((o,j)=>`<button class="opt ${isAr(o)?"ar":""}" onclick="pick(${j})">${o}</button>`).join("")}</div></div><div id="nx"></div>`;
  Q.lock=false;window.scrollTo(0,0);
}
function pick(j){
  if(Q.lock)return;Q.lock=true;
  const q=Q.qs[Q.k],bs=document.querySelectorAll(".opt");
  bs.forEach((b,x)=>{if(q.o[x]===q.c)b.classList.add("ok")});
  if(q.o[j]===q.c)Q.s++;else bs[j].classList.add("no");
  const last=Q.k===Q.qs.length-1;
  document.getElementById("nx").innerHTML=`<button class="btn" onclick="${last?"finish()":"next()"}">${last?"Lihat hasil":"Lanjut →"}</button>`;
}
function next(){Q.k++;ask()}
function finish(){
  if(Q.ex!=null)return finishEx();
  const p=Math.round(Q.s/Q.qs.length*100),i=Q.i,ok=p>=PASS;
  if(S.done[i]==null||p>S.done[i]){S.done[i]=p;save()}
  const more=i<L.length-1,all=ok&&!more;
  $.innerHTML=`<div class="card res"><div class="big">${ok?"🎉":"💪"}</div><h1>${ok?"Lulus!":"Belum lulus"}</h1>
  <div class="stars">${"⭐".repeat(stars(p))||"—"}</div><p>Nilai: <b>${p}%</b> (${Q.s}/${Q.qs.length} benar)</p>
  <p class="sub">${ok?(all?"Alhamdulillah, semua level selesai! 🌟":"Level "+(i+2)+" kini terbuka."):"Butuh minimal "+PASS+"%. Pelajari materi lagi lalu coba ulang."}</p></div>
  ${ok&&more?`<button class="btn" onclick="mat(${i+1})">Lanjut ke Level ${i+2} →</button>`:""}
  <button class="btn alt" onclick="${ok?`quiz(${i})`:`mat(${i})`}">${ok?"Ulangi ujian":"Pelajari materi lagi"}</button>
  ${ok?"":`<button class="btn alt" onclick="quiz(${i})">Coba ujian lagi</button>`}
  <button class="btn alt" onclick="home()">Daftar level</button>`;
  window.scrollTo(0,0);
}
home();
function updToast(w){
  if(document.querySelector(".utoast"))return;
  const d=document.createElement("div");d.className="utoast";
  d.innerHTML='<span>🔔 Versi baru aplikasi tersedia.</span><button id="upd-go">Perbarui</button><button id="upd-no" class="x">Nanti</button>';
  document.body.appendChild(d);
  document.getElementById("upd-no").onclick=()=>d.remove();
  document.getElementById("upd-go").onclick=()=>{
    d.querySelector("span").textContent="Memperbarui…";window.__updAsked=true;
    try{localStorage.setItem("dl_updated","1")}catch(e){}
    w.postMessage({type:"SKIP_WAITING"});
  };
}
if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;
  try{if(localStorage.getItem("dl_updated")){localStorage.removeItem("dl_updated");setTimeout(()=>toast("✅ Aplikasi sudah diperbarui ke versi terbaru"),600)}}catch(e){}
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting&&navigator.serviceWorker.controller)updToast(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)updToast(nw)});
      });
      const chk=()=>{try{reg.update()}catch(e){}};
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);
    }).catch(()=>{});
  });
  let rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!hadCtl||!window.__updAsked)return;rl=true;location.reload()});
}
</script>
